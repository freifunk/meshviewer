# Hashed files below assets/ never change (unless missing); revalidate everything else.
# A map, since an add_header in a location block drops the server-level headers.
map "$status $uri" $meshviewer_cache_control {
    "~^(200|206|304) /assets/" "public, max-age=31536000, immutable";
    default                    "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Cache-Control $meshviewer_cache_control always;

    # No frame-ancestors, so Meshviewer can be embedded on other domains (see embed/).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; connect-src *; font-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Tile servers like openstreetmap.org require a Referer, so keep the origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
