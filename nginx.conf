server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate by default so a new deployment and the service worker update
    # that follows it are not held back by the browser cache.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Everything below assets/ carries a content hash in its filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
