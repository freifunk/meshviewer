name: Build Meshviewer
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  meshviewer-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      # Fail on high/critical only: low/moderate findings keep appearing in
      # build-time tooling (workbox-build, eslint) before upstream ships
      # fixes (currently deepmerge and minimatch), and none of it ends up
      # in the shipped bundle.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
